<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Recommendations</title>
</head>
<body>
    <h1>Your Job Recommendations</h1>

    {% for job in jobs %}
        <h2>{{ job.title }}</h2>
        <p>Company: {{ job.company }}</p>
        <p>Match Score: {{ job.score }}%</p>
        <hr>
    {% endfor %}

    <a href="/">Back to Home</a>
</body>
</html>
